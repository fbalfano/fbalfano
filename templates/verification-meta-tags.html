<!--
  Search-engine ownership verification meta tags.
  Paste the relevant lines inside the <head> of your homepage, then click
  "Verify" in each webmaster console. Replace the content values with the
  codes each console gives you.
-->

<!-- Bing Webmaster Tools -->
<meta name="msvalidate.01" content="REPLACE_WITH_BING_CODE" />

<!-- Yandex Webmaster -->
<meta name="yandex-verification" content="REPLACE_WITH_YANDEX_CODE" />

<!-- Google Search Console (handy to keep alongside) -->
<meta name="google-site-verification" content="REPLACE_WITH_GOOGLE_CODE" />
